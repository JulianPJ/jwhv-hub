name: Promote approved candidate data

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: Data scope to promote
        required: true
        default: all
        type: choice
        options: [all, jobs, housing, visa]

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Promote QA-approved candidate data
        shell: bash
        run: |
          SCOPE="${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'all' }}"
          if [ "$SCOPE" = "all" ]; then
            node scripts/promote.mjs
          else
            node scripts/promote.mjs "$SCOPE"
          fi

      - name: Validate promoted state
        run: node scripts/validate.mjs

      - name: Commit live data when changed
        shell: bash
        run: |
          if git diff --quiet -- data/live; then
            echo "No approved live-data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live
          git commit -m "Promote QA-approved candidate data"
          git push
