name: Validate and publish Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate structured data
        run: node scripts/validate.mjs

      - name: Check source health
        run: node scripts/check-source-health.mjs

      - name: Build static site
        run: node scripts/build.mjs

      - name: Publish static output to gh-pages
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          cp -R _site /tmp/jwhv-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan pages-publish
          git rm -rf .
          cp -R /tmp/jwhv-site/. .
          git add .
          git commit -m "Publish site from ${GITHUB_SHA}"
          git push --force origin HEAD:gh-pages
