name: Validate repository data

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate structured data
        run: node scripts/validate.mjs

      - name: Check browser JavaScript syntax
        run: node --check app.js

      - name: Check local page links
        run: node scripts/check-static-links.mjs
